spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: core
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

  rabbitmq:
    listener:
      simple:
        auto-startup: false

messaging:
  enabled: false